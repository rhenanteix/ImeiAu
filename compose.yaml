services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradein
      POSTGRES_PASSWORD: tradein
      POSTGRES_DB: tradein
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradein"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
